<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Формовод · Рабочая область 1С</title>
<style>
:root{color-scheme:dark;--bg:#0f171a;--panel:#152226;--line:#31464a;--text:#eef4f3;--muted:#aebfbe;--mint:#97dec2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 "Inter","Segoe UI",sans-serif}
main{max-width:1920px;margin:auto;padding:clamp(12px,2vw,28px)}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap}
h1,h2,p{margin:0}
h1{font-size:23px;letter-spacing:-.035em}
h1 span{font-size:13px;font-weight:450;color:var(--muted);margin-left:8px}
h2{font-size:13px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
#pause{min-height:36px;border:1px solid #547a71;border-radius:7px;background:#23433e;padding:6px 12px}
#pause:disabled{opacity:.45;cursor:default}
.controls{display:flex;align-items:center;gap:12px}
#status{color:var(--muted);font-size:13px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,285px);gap:18px;position:relative;align-items:start}
.picture{background:#080e10;aspect-ratio:8/5;overflow:hidden;border:1px solid var(--line);border-radius:9px}
.picture img{display:block;width:100%;height:auto;aspect-ratio:8/5}
aside{border:1px solid var(--line);border-radius:9px;background:var(--panel);overflow:hidden}
aside h2{padding:12px 13px;border-bottom:1px solid var(--line)}
#actors{padding:9px;display:grid;gap:7px}
.actor{width:100%;border:1px solid #3b5054;border-left:3px solid var(--color);border-radius:6px;background:#1d2b2f;text-align:left;padding:8px 10px}
.actor[aria-pressed=true]{border-color:var(--color);background:#26393d}
.role{display:block;font-size:11px;font-weight:650;color:var(--color);margin-bottom:2px}
.action{display:block;font-size:13px;font-weight:600}
.where,.hint{font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.where{display:block;margin-top:3px}
.hint{padding:5px 4px}
.recent{border-top:1px solid var(--line)}
.recent h2{border:0;padding-bottom:4px}
ol{margin:0;padding:0 13px 12px;list-style:none}
li{font-size:11px;padding:7px 0;border-bottom:1px solid #2b3b3e;color:var(--muted);overflow-wrap:anywhere}
li:last-child{border-bottom:0}
.connector{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
@media(max-width:735px){.layout{grid-template-columns:minmax(0,1fr)}.connector{display:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Формовод <span>Рабочая область 1С</span></h1>
    <div class="controls"><p id="status" role="status">Подключение…</p><button id="pause" disabled>Приостановить правки</button></div>
  </header>
  <div class="layout">
    <div class="picture"><img src="stream" alt="Живое окно 1С"></div>
    <aside>
      <h2>Роли</h2>
      <div id="actors"><p class="hint">Здесь появятся действия MCP.</p></div>
      <div class="recent" hidden><h2>Последние действия</h2><ol></ol></div>
    </aside>
    <canvas class="connector" aria-hidden="true"></canvas>
  </div>
</main>
<script>
const names = {
  entry:['Ввод','#8dc7f2'], contract:['Договор','#c5a8fb'], check:['Сверка','#99e5b7'],
  price:['Цены','#85c6ff'], quote:['Расценка','#f6a5b5'], product:['Номенклатура','#c4a4ef'],
  quantity:['Количество','#81d7d5'], counterparty:['Контрагент','#7fddcb'], gtd:['ГТД','#ff9bd0'],
};
const descriptions = {
  point:['Наводит курсор','Отметил поле'], click:['Открывает поле или команду','Щелчок выполнен'],
  type:['Вводит значение','Ввод завершён'], verify:['Сравнивает значение','Сверка завершена'],
  read:['Читает поле','Поле прочитано'], key:['Нажимает клавишу','Клавиша нажата'],
  hover:['Наводит мышь','Навёл мышь'], scroll:['Прокручивает форму','Форма прокручена'],
};
const outcomes = {match:'Совпало',mismatch:'Расхождение',error:'Действие прервано'};
const panel = document.getElementById('actors');
const status = document.getElementById('status');
const pause = document.getElementById('pause');
const stage = document.querySelector('.layout');
const view = document.querySelector('.picture img');
const canvas = document.querySelector('.connector');
const ctx = canvas.getContext('2d');
const recent = document.querySelector('.recent');
const list = recent.querySelector('ol');
let state, selected, previous, reading = false, changing = false, revision = 0;
const cards = new Map();

function describe(item) {
  return outcomes[item.state] || descriptions[item.action][item.state==='running' ? 0 : 1];
}
function put(node, value) {
  if (node.textContent!==value) node.textContent=value;
}
function render(data) {
  state=data;
  const editing = data.actions.some(item=>item.state==='running' && ['type','key','click','scroll'].includes(item.action));
  put(status,data.paused ? editing ? 'Пауза после текущего действия' : 'Правки на паузе' : 'Сеанс открыт');
  put(pause,data.paused?'Возобновить правки':'Приостановить правки');
  pause.disabled=false;
  const roles = new Set(data.actions.map(item=>item.role));
  for (const [role,card] of cards) {
    if (!roles.has(role)) {card.remove();cards.delete(role);}
  }
  panel.querySelector('.hint')?.remove();
  if (!roles.size) {
    const hint=document.createElement('p');
    hint.className='hint';hint.textContent='Здесь появятся действия MCP.';panel.append(hint);
  }
  for (const item of data.actions) {
    const [name,color] = names[item.role];
    let card = cards.get(item.role);
    if (!card) {
      card=document.createElement('button');card.className='actor';
      card.innerHTML='<span class="role"></span><span class="action"></span><span class="where"></span>';
      card.style.setProperty('--color',color);
      card.onclick=()=>{selected=selected===item.role?null:item.role;select();draw();};
      cards.set(item.role,card);panel.append(card);
    }
    put(card.children[0],name);
    put(card.children[1],describe(item));
    put(card.children[2],[item.target.label,item.note].filter(Boolean).join(' · '));
  }
  const recentKey=JSON.stringify(data.recent);
  if (recentKey!==previous) {
    previous=recentKey;
    recent.hidden=!data.recent.length;
    list.replaceChildren(...data.recent.slice(0,7).map(item=>{
      const li=document.createElement('li');
      li.textContent=[names[item.role][0],describe(item),item.target.label].filter(Boolean).join(' · ');
      return li;
    }));
  }
  select();draw();
}
function select() {
  for (const [role,card] of cards) card.setAttribute('aria-pressed',String(selected===role));
}
function draw() {
  const area=stage.getBoundingClientRect();
  canvas.width=Math.round(area.width*devicePixelRatio);canvas.height=Math.round(area.height*devicePixelRatio);
  ctx.scale(devicePixelRatio,devicePixelRatio);
  const activity=state?.actions.find(item=>item.role===selected);
  const target=state?.targets[selected];
  if (!target || !activity || target.ref!==activity.target.ref || !cards.has(selected)) return;
  const image=view.getBoundingClientRect(), card=cards.get(selected).getBoundingClientRect();
  const x=image.left-area.left+target.x*image.width, y=image.top-area.top+target.y*image.height-1;
  const bend=image.right-area.left+6, cx=card.left-area.left, cy=card.top+card.height/2-area.top;
  ctx.strokeStyle=names[selected][1];ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=1.8;
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(bend-5,y);
  ctx.bezierCurveTo(bend+6,y,bend-4,cy,cx,cy);ctx.stroke();
  ctx.beginPath();ctx.arc(x,y,3.5,0,Math.PI*2);ctx.fill();
}
async function read() {
  if (reading || changing) return;
  reading=true;
  const before=revision;
  try {
    const response=await fetch('state',{cache:'no-store'});
    if (!response.ok) throw Error(response.status);
    const data=await response.json();
    if (before===revision) render(data);
  } catch {
    if (before===revision) {put(status,'Связь с MCP потеряна');pause.disabled=true;}
  } finally {reading=false;}
}
pause.onclick=async()=>{
  if (!state || changing) return;
  changing=true;revision++;pause.disabled=true;
  try {
    const response=await fetch(state.paused?'resume':'pause',{method:'POST'});
    if (!response.ok) throw Error(response.status);
    render(await response.json());
  } catch {
    put(status,'Команда не подтверждена');
  } finally {changing=false;}
};
new ResizeObserver(draw).observe(stage);
read();setInterval(read,320);
</script>
</body>
</html>
