# Use the actual publication URL and local installation directory.
# Start-Formovod.cmd --print-mcp outputs the configuration for this computer.
[mcp_servers.formovod-erp]
command = "C:/Formovod/.venv/Scripts/python.exe"
cwd = "C:/Formovod"
args = ["-B", "-X", "utf8", "app/visual_mcp.py", "--url", "https://erp.example.com/erp/ru_RU/", "--panel", "--manual-login"]
startup_timeout_sec = 35
tool_timeout_sec = 240
